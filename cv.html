<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071a35">
    <meta name="description" content="CV Tegar Setya Andiputra.">
    <title>CV — Tegar Setya Andiputra</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #eef2ff;
        color: #172554;
        font-family: Arial, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem max(1.25rem, calc((100% - 900px) / 2));
        background: #071a35;
      }
      header a {
        color: #fff;
        font-size: .9rem;
        font-weight: 700;
        text-decoration: none;
      }
      header a:hover { text-decoration: underline; }
      main {
        display: flex;
        justify-content: center;
        padding: 1.5rem 1rem;
      }
      main img {
        display: block;
        width: min(100%, 768px);
        height: auto;
        box-shadow: 0 16px 48px rgb(15 23 42 / 18%);
      }
      @media print {
        body { background: #fff; }
        header { display: none; }
        main { padding: 0; }
        main img { width: 100%; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html">Tegar Setya Andiputra</a>
      <a href="index.html">Kembali ke Portofolio</a>
    </header>
    <main>
      <img src="assets/cv-tegar.png" alt="CV Tegar Setya Andiputra">
    </main>
  </body>
</html>
