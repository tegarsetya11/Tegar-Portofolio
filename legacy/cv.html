<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05070B">
    <meta name="description" content="CV Tegar Setya Andiputra — Junior Technical Support & Network / Web Specialist.">
    <title>Curriculum Vitae — Tegar Setya Andiputra</title>
    <link rel="icon" type="image/png" sizes="768x768" href="assets/logo-tegar-biru.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #05070B;
        color: #EAF3FF;
        font-family: 'DM Sans', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem max(1.25rem, calc((100% - 1000px) / 2));
        background: rgba(8, 20, 38, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(85, 184, 255, 0.18);
      }
      .brand-title {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: #fff;
        text-decoration: none;
        font-family: 'Manrope', sans-serif;
        font-weight: 800;
        font-size: 0.95rem;
      }
      .brand-title span {
        color: #55B8FF;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem 1rem;
        border-radius: 0.75rem;
        font-size: 0.8rem;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.25s ease;
        cursor: pointer;
      }
      .btn-outline {
        border: 1px solid rgba(85, 184, 255, 0.3);
        background: rgba(11, 31, 58, 0.5);
        color: #EAF3FF;
      }
      .btn-outline:hover {
        border-color: #55B8FF;
        background: #0B1F3A;
        transform: translateY(-1px);
      }
      .btn-primary {
        border: 1px solid transparent;
        background: linear-gradient(135deg, #1677FF, #0E5CD5);
        color: #fff;
        box-shadow: 0 0 16px rgba(22, 119, 255, 0.35);
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #3690FF, #1677FF);
        box-shadow: 0 0 24px rgba(85, 184, 255, 0.45);
        transform: translateY(-1px);
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1rem 4rem;
      }
      .cv-container {
        position: relative;
        border-radius: 1.5rem;
        padding: 0.5rem;
        background: rgba(11, 31, 58, 0.6);
        border: 1px solid rgba(85, 184, 255, 0.2);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
        max-width: 820px;
        width: 100%;
      }
      .cv-container img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 1.15rem;
      }
      @media print {
        body { background: #fff; color: #000; }
        header { display: none; }
        main { padding: 0; }
        .cv-container { border: none; padding: 0; box-shadow: none; max-width: 100%; }
        .cv-container img { border-radius: 0; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="brand-title">
        Tegar Setya<span>. A</span>
      </a>
      <div class="header-actions">
        <button type="button" class="btn btn-outline" onclick="window.print()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          Cetak / Unduh
        </button>
        <a href="index.html" class="btn btn-primary">
          ← Kembali ke Portofolio
        </a>
      </div>
    </header>
    <main>
      <div class="cv-container">
        <img src="assets/cv-tegar.png" alt="Curriculum Vitae Tegar Setya Andiputra">
      </div>
    </main>
  </body>
</html>
